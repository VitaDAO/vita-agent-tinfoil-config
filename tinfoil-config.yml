# Tinfoil Container Configuration — vita-agent-prod (SLIM, app-only / model split)
# App calls the model over attested HTTPS to vita-model-prod (provider=tinfoil,
# pinned to VitaDAO/vita-agent-model-test-tinfoil-config). No GPU, no vLLM here.

cvm-version: 0.7.5
cpus: 4
memory: 16384

containers:
  - name: vita-agent
    image: "ghcr.io/vitadao/vita-agent:34759a6@sha256:3b0a1a1d62fadb0028156e7db96c9cfb22669b15dc3e92110d5bc637e305669f"
    registry:
      username: DobrinAlexandru
      password_secret: VITA_AGENT_GHCR_TOKEN
    env:
      - VITA_AGENT_PORT: "8787"
      - STORAGE_BACKEND: "supabase"
      - VITA_AGENT_ENABLE_NEED_FILL: "1"
      # Context V2 uses the reviewed encrypted turn/key-epoch schema.
      - VITA_TURN_ENVELOPE_V2: "1"
      - VITA_CONTEXT_OWNER_BACKEND: "1"
      - VITA_SESSION_V2: "1"
      - VITA_HEALTH_RESOLVER_V2: "1"
      - VITA_CONTEXT_V2_CANARY_PERCENT: "100"
      - VITA_TURN_V1_POLICY: "disabled"
      - VITA_AGENT_ENABLE_LEGACY_ROUTES: "0"
      - VITA_ACTIVE_HEALTH_FOCUS_V1: "1"
      # Orchestrator v3 Slice C. Admits the grant_catalog_v1 capability, so the
      # client seals per-context authorization rows and the agent injects the
      # "# Authorized contexts" block. Staging-only since 2026-07-21 (b110226).
      #
      # What it buys: without a catalog the model is BLIND to authorization —
      # `withheld` appears nowhere in context_assembler.py, so a denied context
      # is handled entirely by HEALTH_DATA_NOT_GRANTED_ANSWERS, a canned string
      # returned BEFORE inference. That terminal is whole-turn and single-slice,
      # so an ask spanning a granted and a denied context loses the granted half
      # and the user is told "turn on X" instead of getting the labs they asked
      # for. The catalog carries grant/status/withheld_reason/presence per row,
      # which is what lets one answer say "here are your labs; wearables are off"
      # and distinguish no_data from permission_denied.
      #
      # Its one hazard is the model reading `presence: present` and inventing a
      # number from authorization metadata. Three defenses, all verified:
      #  * the injected block itself forbids it in text;
      #  * should_inject_grant_catalog_instructions_v1 refuses to inject at all
      #    unless coverage is armed or the route is catalog-only general —
      #    measured: coverage_armed=0, catalog_only_general=0 -> inject=False;
      #  * the route-independent fabrication backstop (zero loaded facts + a
      #    personal number -> reject) covers exactly this failure mode. It did
      #    NOT exist when this flag was written, which is what changed the
      #    ship/hold calculus.
      #
      # Rollback is symmetric: drop this line and relaunch. The capability is
      # negotiated, so an off flag stops the whole chain — the agent stops
      # advertising grant_catalog_v1, the client stops sealing one, and
      # injection sees catalog=None.
      - VITA_GRANT_CATALOG_V1: "1"
      - VITA_AUBRAI_GATEWAY_V2: "0"
      - VITA_AUBRAI_DURABLE_BUDGET: "0"
      - VITA_AUBRAI_ENCRYPTED_RESPONSE_REQUIRED: "0"
      - VITA_AUBRAI_ATTESTATION_REQUIRED: "0"
      - STRICT_PROD: "1"
      - AAD_REQUIRED: "0"
      - VITA_ROUTING_MODE: "direct"
      - VITA_AGENT_STREAMING: "0"
      # P3-deploy-flags — audit-feature flags pinned in committed config (not just
      # the ephemeral enclave Variables layer), so a fresh `container create` can
      # never silently disable the safety/recall channels.
      - VITA_AGENT_PINNED_SAFETY: "1"
      - VITA_AGENT_EXACT_MATCH: "1"
      - VITA_AGENT_INPUT_FILTER: "1"
      - VITA_AGENT_TOOLCALL_SALVAGE: "1"
      - VITA_AGENT_GRADED_EFFORT: "1"
      - VITA_AGENT_RESPONSE_SHAPE: "1"
      - VITA_AGENT_PARALLEL_TOOLS: "1"
      - VITA_AGENT_STATIC_PREFIX: "1"
      - OPENAI_AGENTS_DISABLE_TRACING: "1"
      - VITA_AGENT_ENCLAVE_URL: "https://vita-agent-prod.vitality-now.containers.tinfoil.dev/"
      - VITA_AGENT_REQUIRE_SEALED_DEK: "1"
      - VITA_AGENT_ACCEPT_LEGACY_DEK_HEADERS: "0"
      - VITA_AGENT_JSON_LOGS: "1"
      - VITA_AGENT_PROVIDER_HEALTH_DIAGNOSTICS: "1"
      # Projects the raw HealthSnapshot into the model/tool-safe view (display
      # names, humanized availability, no snake_case metric ids or reason
      # codes) and enables the registry-aware prose-leak guard.
      #
      # Held back until BOTH of its blockers were fixed, because turning it on
      # before them would have made prod worse, not better:
      #  * the projection withheld `sample_values`, which resolve_binding
      #    verifies MIN/MAX/RANGE/MEAN from — the model could not see the points
      #    it was required to declare over (fixed, a5a53c3);
      #  * the projection emitted `availability: "not_recorded"`, the exact
      #    token its own leak guard rejects, and availability tokens are not
      #    repaired — so the guard destroyed the whole answer (fixed, 1671686).
      #
      # NOT in CONTEXT_V2_FLAGS, so this is not a partial-bundle risk (checked:
      # that all-or-nothing set is TURN_ENVELOPE_V2 / CONTEXT_OWNER_BACKEND /
      # SESSION_V2 / HEALTH_RESOLVER_V2, all already on here).
      #
      # Evidence, 2026-07-26: A/B of the real orchestrator + resolver + model,
      # 33 turns per arm ON vs OFF — 0 violations, 0 canned terminals, 0
      # prose-leak guard firings in both arms. Staging has run with it on for
      # weeks. Rollback is symmetric: set to "0" and relaunch.
      - VITA_HEALTH_PROJECTION_V1: "1"
      - SENTRY_ENVIRONMENT: "production"
      - SENTRY_RELEASE: "vita-agent@18e5d49"
      - VITA_AGENT_VERSION: "vita-agent@18e5d49"
      - VITA_AGENT_DEPLOYMENT_ID: "vita-agent-prod-cb9f8bd"
      - VITA_AGENT_POLICY_VERSION: "vita-agent-policy/2026-07-12"
      - VITA_CONTEXT_V2_COHORT_POLICY_VERSION: "context-v2-rollout/1"
      - SENTRY_TRACES_SAMPLE_RATE: "0.1"
      - SENTRY_PROFILES_SAMPLE_RATE: "0"
      - SUPABASE_JWT_VERIFY_MODE: "jwks"
      - SUPABASE_JWKS_URL: "https://cuvszjeaitakfvccvofl.supabase.co/auth/v1/.well-known/jwks.json"
      - VITA_AGENT_RATE_LIMIT_RPM: "60"
      - VITA_AGENT_MAX_REQUEST_BYTES: "2097152"
      - VITA_AGENT_EMBED_MODEL: "BAAI/bge-base-en-v1.5"
      - VITA_AGENT_PERSONA_REFRESH_EVERY: "10"
      - VITA_AGENT_AUTO_EXTRACT: "1"
      - VITA_AGENT_JOB_AUTORUN: "1"
      - AUBRAI_MODE: "x402"
      - AUBRAI_DEBUG: "0"
      - AUBRAI_FAST: "1"
      - VITA_AGENT_MODEL_PROVIDER: "tinfoil"
      - VITA_AGENT_TINFOIL_TRANSPORT: "sdk"
      # Manager model: gemma4-31b via native Tinfoil Inference SDK discovery
      # (inference.tinfoil.sh / ATC router) — same block staging has run since
      # 2026-08-06 and the exact model+code pair behind the 11/11 staging
      # browser matrix. Owner approved the prod model promote 2026-08-08.
      # Rollback: relaunch tag v0.14.146 restores qwen-opus + the old code.
      - VITA_AGENT_MODEL: "gemma4-31b"
      # Adaptive session replay: normal chat should not prefill 131K tokens.
      # 131K remains available only for explicit full-history/full-audit asks.
      - VITA_AGENT_HISTORY_TOKEN_BUDGET_STRATEGY: "adaptive"
      - VITA_AGENT_HISTORY_TOKEN_BUDGET: "22000"
      - VITA_AGENT_HISTORY_TOKEN_BUDGET_FAST: "8000"
      - VITA_AGENT_HISTORY_TOKEN_BUDGET_NORMAL: "22000"
      - VITA_AGENT_HISTORY_TOKEN_BUDGET_COMPLEX: "32768"
      - VITA_AGENT_HISTORY_TOKEN_BUDGET_DEEP: "65536"
      - VITA_AGENT_HISTORY_TOKEN_BUDGET_FULL: "131072"
      # Hosted gemma4-31b is non-reasoning: qwen-era THINKING=auto plus the
      # top_k/min_p knobs return HTTP 400 on tool-bearing turns (measured on
      # staging 2026-08-06). Sampling uses provider defaults, as on staging.
      - VITA_AGENT_CHAT_THINKING: "0"
      - VITA_AGENT_CHAT_MAX_TOKENS: "6000"
      # REMOVED 2026-07-25: these pinned the PRE-FIX values and silently
      # disabled a code fix. intents/__init__.py raised the LOW cap to 4000
      # (from 1200) on 2026-07-23 precisely because "LOW is thinking-ON, so a
      # 1200 cap starved the visible answer" — and LOW is the everyday tier
      # (health_analysis, science, general, profile). The env override meant
      # prod kept running the starving value, so the fix never took effect
      # here. Same for LIGHT (code 1300, pinned 800) and THINK_BUDGET_LOW
      # (code 600, pinned 300). Deleting them lets the code defaults apply;
      # they remain env-tunable if a real prod-specific reason appears.
      - VITA_AGENT_MAX_TOOL_CALLS: "10"
      - REDPILL_E2EE: "1"
      - REDPILL_ATTESTATION_MODE: "phala-cloud-light"
      - REDPILL_ATTESTATION_RETRIES: "6"
      - REDPILL_ATTESTATION_RETRY_BACKOFF_S: "0.5"
      - REDPILL_REQUIRE_ATTESTATION: "1"
      - REDPILL_REQUIRE_GPU_ATTESTATION: "1"
      - REDPILL_PIN_MRTD: "f06dfda6dce1cf904d4e2bab1dc370634cf95cefa2ceb2de2eee127c9382698090d7a4a13e14c536ec6c9c3c8fa87077"
      - REDPILL_PIN_RTMR0: "fb14dc139f33d6fcf474bc8332cac001259fb31cfbcb6b34d4ceeb552a2c4466884a0cbde45ad98a05c5c060c23ad65a"
      - REDPILL_PIN_RTMR1: "a7b523278d4f914ee8df0ec80cd1c3d498cbf1152b0c5eaf65bad9425072874a3fcf891e8b01713d3d9937e3e0d26c15"
      - REDPILL_PIN_RTMR2: "24847f5c5a2360d030bc4f7b8577ce32e87c4d051452c937e91220cab69542daef83433947c492b9c201182fc9769bbe"
    secrets:
      - VITA_AGENT_GHCR_TOKEN
      - TINFOIL_API_KEY
      - REDPILL_API_KEY
      - SENTRY_DSN
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_INTERNAL_AUTH_EMAIL
      - SUPABASE_INTERNAL_AUTH_PASSWORD
      - AUBRAI_HPKE_PUBLIC_KEY
      - X402_WALLET_PRIVATE_KEY
      - VITA_PROTOCOL_TICKET_HMAC_KEY

shim:
  upstream-port: 8787
  paths:
    - /api/health
    - /metrics
    - /.well-known/enclave-pubkey
    - /.well-known/vita-agent-capabilities
    - /.well-known/vita-agent-turn-features
    - /api/v1/turn-protocol-ticket
    - /api/v1/capsule
    - /api/v1/capsule/stream
    - /api/v1/jobs
    - /api/v1/jobs/*
