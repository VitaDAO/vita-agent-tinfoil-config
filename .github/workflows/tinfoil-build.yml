name: Build & Attest Tinfoil Image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - uses: tinfoilsh/pri-build-action@768ada355b32b301839c983409304dc53bcc03ff  # v0.13.1 - matches cvm 0.14.10 (same pin as aubrai-harness-prod); mark-as-latest defaults to false
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # v0.10.0 dropped the `prerelease` input; it runs `gh release create
          # --latest=false` by default (mark-as-latest defaults to "false"), which
          # preserves the "do NOT auto-flip /releases/latest" safety — atc keeps
          # serving the current bundle until an explicit post-deploy promotion.

      # The action publishes a FULL release. Until the container is relaunched on
      # this tag and verified, keep it a prerelease so nothing (and no one) reads
      # it as the deployed version; the post-deploy promotion flips it with
      # `gh release edit <tag> --latest --prerelease=false` (vita-agent#161, #176).
      - name: Mark the new release prerelease until deployed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease
